<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <!-- Device frame -->
  <rect width="800" height="500" fill="#f8f9fa"/>
  
  <!-- Smartphone outline -->
  <rect x="250" y="50" width="300" height="400" rx="20" ry="20" fill="#343a40"/>
  <rect x="260" y="60" width="280" height="380" rx="10" ry="10" fill="#f8f9fa"/>
  
  <!-- Status bar -->
  <rect x="260" y="60" width="280" height="30" rx="10" ry="10" fill="#0f4c81"/>
  <text x="400" y="80" text-anchor="middle" font-family="Arial" font-size="14" fill="white">AquaLink Control</text>
  
  <!-- Navigation bar -->
  <rect x="260" y="410" width="280" height="30" rx="10" ry="10" fill="#0f4c81"/>
  
  <!-- Main app interface section -->
  <rect x="270" y="100" width="260" height="300" fill="#f8f9fa"/>
  
  <!-- Status card -->
  <rect x="280" y="110" width="240" height="100" rx="10" ry="10" fill="white" stroke="#4dabf7" stroke-width="2"/>
  
  <!-- Status indicators -->
  <g transform="translate(300, 130)">
    <circle cx="0" cy="0" r="6" fill="#4dabf7"/>
    <text x="15" y="5" font-family="Arial" font-size="14" fill="#343a40">Status: Valve Active</text>
  </g>
  
  <!-- Countdown timer -->
  <text x="400" y="170" text-anchor="middle" font-family="Arial" font-size="22" font-weight="bold" fill="#0f4c81">1m 30s</text>
  
  <!-- Control buttons -->
  <rect x="300" y="190" width="90" height="30" rx="5" ry="5" fill="#0f4c81"/>
  <text x="345" y="210" text-anchor="middle" font-family="Arial" font-size="12" fill="white">ACTIVATE</text>
  
  <rect x="410" y="190" width="90" height="30" rx="5" ry="5" fill="#dc3545"/>
  <text x="455" y="210" text-anchor="middle" font-family="Arial" font-size="12" fill="white">DEACTIVATE</text>
  
  <!-- Settings card -->
  <rect x="280" y="220" width="240" height="170" rx="10" ry="10" fill="white" stroke="#4dabf7" stroke-width="2"/>
  
  <!-- Settings header -->
  <rect x="280" y="220" width="240" height="30" rx="10" ry="10" fill="#e9ecef"/>
  <text x="400" y="240" text-anchor="middle" font-family="Arial" font-size="14" fill="#495057">Duration Settings</text>

  <!-- Settings form -->
  <g transform="translate(300, 270)">
    <!-- Hours -->
    <text x="0" y="0" font-family="Arial" font-size="12" fill="#495057">Hours</text>
    <rect x="0" y="10" width="50" height="25" fill="white" stroke="#ced4da" stroke-width="1" rx="3" ry="3"/>
    <text x="25" y="27" text-anchor="middle" font-family="Arial" font-size="12" fill="#495057">0</text>
    
    <!-- Minutes -->
    <text x="70" y="0" font-family="Arial" font-size="12" fill="#495057">Minutes</text>
    <rect x="70" y="10" width="50" height="25" fill="white" stroke="#ced4da" stroke-width="1" rx="3" ry="3"/>
    <text x="95" y="27" text-anchor="middle" font-family="Arial" font-size="12" fill="#495057">30</text>
    
    <!-- Seconds -->
    <text x="140" y="0" font-family="Arial" font-size="12" fill="#495057">Seconds</text>
    <rect x="140" y="10" width="50" height="25" fill="white" stroke="#ced4da" stroke-width="1" rx="3" ry="3"/>
    <text x="165" y="27" text-anchor="middle" font-family="Arial" font-size="12" fill="#495057">0</text>
  </g>
  
  <!-- Apply button -->
  <rect x="300" y="340" width="200" height="30" rx="5" ry="5" fill="#4dabf7"/>
  <text x="400" y="360" text-anchor="middle" font-family="Arial" font-size="12" fill="white">APPLY SETTINGS</text>
  
  <!-- Connected users example -->
  <g transform="translate(500, 150)">
    <!-- Phone outline -->
    <rect x="50" y="0" width="80" height="140" rx="10" ry="10" fill="#343a40"/>
    <rect x="55" y="10" width="70" height="120" rx="5" ry="5" fill="#f8f9fa"/>
    
    <!-- Mini screen content -->
    <rect x="55" y="10" width="70" height="15" rx="5" ry="5" fill="#0f4c81"/>
    <rect x="60" y="35" width="60" height="40" rx="5" ry="5" fill="white" stroke="#4dabf7" stroke-width="1"/>
    <rect x="60" y="85" width="60" height="30" rx="5" ry="5" fill="white" stroke="#4dabf7" stroke-width="1"/>
    
    <!-- Connection illustration -->
    <path d="M 90 140 L 180 250 L 260 280" fill="none" stroke="#4dabf7" stroke-width="2" stroke-dasharray="5,5"/>
    <circle cx="260" cy="280" r="5" fill="#4dabf7"/>
  </g>
  
  <!-- Tablet example -->
  <g transform="translate(100, 200)">
    <!-- Tablet outline -->
    <rect x="0" y="0" width="120" height="160" rx="10" ry="10" fill="#343a40"/>
    <rect x="5" y="10" width="110" height="140" rx="5" ry="5" fill="#f8f9fa"/>
    
    <!-- Mini screen content -->
    <rect x="5" y="10" width="110" height="20" rx="5" ry="5" fill="#0f4c81"/>
    <rect x="10" y="40" width="100" height="50" rx="5" ry="5" fill="white" stroke="#4dabf7" stroke-width="1"/>
    <rect x="10" y="100" width="100" height="40" rx="5" ry="5" fill="white" stroke="#4dabf7" stroke-width="1"/>
    
    <!-- Connection illustration -->
    <path d="M 110 160 L 170 250 L 260 280" fill="none" stroke="#4dabf7" stroke-width="2" stroke-dasharray="5,5"/>
    <circle cx="170" cy="250" r="5" fill="#4dabf7"/>
  </g>
</svg> 